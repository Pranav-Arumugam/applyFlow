name: ApplyFlow #name of the pipleine

on: #when to run
  push:
    branches: [typescript-migration]
  pull_request:
    branches: [main]

jobs: #What to run
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test

      - name: Build Backend
        run: npm run build

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm ci

      - name: Type Check Frontend
        working-directory: client
        run: npx tsc --noEmit

      - name: Run Frontend Tests
        working-directory: client
        run: npm test

      - name: Build Frontend
        working-directory: client
        run: npm run build
