version: "3.8"

name: applyflow

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/test"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
